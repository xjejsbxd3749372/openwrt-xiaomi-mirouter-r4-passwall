name: Build OpenWrt 19.07 - Xiaomi Mi Router 4 - PassWall

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'build-*'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-19.07
  OPENWRT_DIR: openwrt
  BUILD_JOBS: 4

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Create build swap
        shell: bash
        run: |
          set -eux
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang ccache ecj fastjar file g++ gawk gettext \
            git libncurses5-dev libncursesw5-dev libssl-dev python3 \
            python3-distutils rsync subversion swig unzip wget xsltproc \
            zlib1g-dev jq quilt default-jre-headless
          sudo apt-get clean
          ccache --max-size=3G

      - name: Install Python 2.7
        shell: bash
        run: |
          set -eux
          cd /tmp
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/python2 --enable-unicode=ucs4 --disable-shared
          make -j2
          sudo make install
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2.7
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2
          python2 --version

      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            openwrt/dl
          key: openwrt-19.07-mir4-${{ runner.os }}-${{ hashFiles('.config') }}
          restore-keys: |
            openwrt-19.07-mir4-${{ runner.os }}-

      - name: Clone OpenWrt 19.07
        shell: bash
        run: |
          set -eux
          rm -rf "${OPENWRT_DIR}"
          git clone --depth 1 --single-branch --branch "${REPO_BRANCH}" "${REPO_URL}" "${OPENWRT_DIR}"

      - name: Prepare PassWall feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -eux
          bash "${GITHUB_WORKSPACE}/diy-part1.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply compatibility patches
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -eux
          bash "${GITHUB_WORKSPACE}/diy-part2.sh"
          # Re-index packages created/overwritten by diy-part2 (xray, lyaml, kmods)
          ./scripts/feeds install -a || true

      - name: Install and validate configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -eux
          cp "${GITHUB_WORKSPACE}/.config" .config

          # Force critical options so defconfig cannot drop them
          for opt in \
            CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mir4=y \
            CONFIG_PACKAGE_luci-app-passwall=y \
            CONFIG_IPV6=y \
            CONFIG_PACKAGE_kmod-inet-diag=y \
            CONFIG_PACKAGE_kmod-netlink-diag=y \
            CONFIG_PACKAGE_xray-core=y \
            CONFIG_PACKAGE_sing-box=y \
            CONFIG_PACKAGE_lyaml=y
          do
            key="${opt%%=*}"
            sed -i "/^${key}=/d; /^# ${key} is not set/d" .config || true
            echo "${opt}" >> .config
          done

          make defconfig

          # Hard requirements
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mir4=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_IPV6=y$' .config

          # Xray 26.9.9 must exist (diy-part2 writes under package/feeds/...)
          if [ -f package/feeds/passwall_packages/xray-core/Makefile ]; then
            grep -q 'PKG_VERSION:=26.9.9' package/feeds/passwall_packages/xray-core/Makefile
          elif [ -f feeds/passwall_packages/xray-core/Makefile ]; then
            grep -q 'PKG_VERSION:=26.9.9' feeds/passwall_packages/xray-core/Makefile
          else
            echo "ERROR: xray-core Makefile not found after diy-part2"
            find package feeds -name Makefile -path '*xray*' 2>/dev/null | head -20 || true
            exit 1
          fi

          # lyaml
          if [ -f package/lyaml/Makefile ]; then
            grep -q 'luarocks make --pack-binary-rock' package/lyaml/Makefile
          else
            echo "ERROR: package/lyaml/Makefile missing"
            exit 1
          fi

          # kmod selection: prefer package symbols; fall back to kernel config presence
          if ! grep -q '^CONFIG_PACKAGE_kmod-inet-diag=y$' .config; then
            echo "WARNING: CONFIG_PACKAGE_kmod-inet-diag not set after defconfig"
            grep -E 'CONFIG_INET_DIAG' target/linux/generic/config-4.14 || true
          fi
          if ! grep -q '^CONFIG_PACKAGE_kmod-netlink-diag=y$' .config; then
            echo "WARNING: CONFIG_PACKAGE_kmod-netlink-diag not set after defconfig"
            grep -E 'CONFIG_NETLINK_DIAG' target/linux/generic/config-4.14 || true
          fi

          # Soft upstream version info
          grep -E 'PKG_VERSION:=' package/feeds/passwall_packages/sing-box/Makefile 2>/dev/null \
            || grep -E 'PKG_VERSION:=' feeds/passwall_packages/sing-box/Makefile 2>/dev/null \
            || true
          grep -E 'PKG_VERSION:=' package/feeds/passwall_packages/shadowsocksr-libev/Makefile 2>/dev/null \
            || grep -E 'PKG_VERSION:=' feeds/passwall_packages/shadowsocksr-libev/Makefile 2>/dev/null \
            || true

          echo "Configuration validation passed."

      - name: Download package sources
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: make download -j8 V=s

      - name: Compile firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          make -j"${BUILD_JOBS}" V=s 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      - name: Collect firmware
        if: success()
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -eux
          target_dir=bin/targets/ramips/mt7621
          out_dir="${GITHUB_WORKSPACE}/firmware"
          rm -rf "${out_dir}"
          mkdir -p "${out_dir}"
          find "${target_dir}" -maxdepth 1 -type f \( \
            -name '*.bin' -o -name '*.img' -o -name '*.tar' \
            -o -name '*.manifest' -o -name 'sha256sums' -o -name '*.json' \
          \) -exec cp -av {} "${out_dir}/" \;
          cp -av .config "${out_dir}/config.final"
          {
            echo "OpenWrt branch: ${REPO_BRANCH}"
            echo "Target: Xiaomi Mi Router 4 / MT7621"
            echo "Build run: ${GITHUB_RUN_NUMBER}"
          } > "${out_dir}/BUILD_INFO.txt"
          (cd "${out_dir}" && sha256sum * > SHA256SUMS.txt)
          ls -lah "${out_dir}"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-passwall-${{ github.run_number }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('openwrt-19.07-mir4-{0}', github.run_number) }}
          name: OpenWrt 19.07 MIR4 PassWall Build ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            firmware/*
            .config
