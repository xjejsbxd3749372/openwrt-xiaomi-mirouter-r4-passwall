name: Build OpenWrt 18.06 MIR4 MTK-HWNAT PassWall

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mir4-mtk-18.06

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-18.06
  OPENWRT_DIR: openwrt
  BUILD_JOBS: 4
  CC: gcc-10
  CXX: g++-10
  PASSWALL_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall.git
  PASSWALL_CORE_TAG: 4.69-4
  PASSWALL_LUCI_COMMIT: d1e618220a9a0a4b73d536101f452a2f4cf14861
  GOLANG_REPO: https://github.com/sbwml/packages_lang_golang.git
  GOLANG_BRANCH: 21.x
  MTK_REPO: https://github.com/coolsnowwolf/lede.git
  MTK_COMMIT: 24cb7521b659dac3f37907364d96eb998c1d04af

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-10 g++-10 clang llvm ccache file g++ gawk gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev python3 rsync subversion swig \
            unzip wget curl xsltproc zlib1g-dev jq quilt binutils bison flex libelf-dev \
            libtool autoconf automake pkg-config

      - name: Install Python 2.7
        run: |
          set -eux
          cd /tmp
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/python2 --enable-unicode=ucs4 --disable-shared
          make -j2
          sudo make install
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2
          python --version

      - name: Create swap
        run: |
          set -eux
          if swapon --show | grep -q '/swapfile'; then exit 0; fi
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 --single-branch --branch "${REPO_BRANCH}" "${REPO_URL}" "${OPENWRT_DIR}"

      - name: Update base feeds
        working-directory: openwrt
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare source
        working-directory: openwrt
        run: |
          set -eux
          bash "${GITHUB_WORKSPACE}/diy-part1.sh"
          bash "${GITHUB_WORKSPACE}/diy-part2.sh"

      - name: Defconfig and validation
        working-directory: openwrt
        run: |
          set -eux
          export CC=gcc-10
          export CXX=g++-10
          cp "${GITHUB_WORKSPACE}/.config" .config
          make defconfig

          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_mir4=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt7603e=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt76x2e=y$' .config
          grep -q '^CONFIG_PACKAGE_mt_wifi=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-mtwifi=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-ipt-offload=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-tcp-bbr=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-zram=y$' .config
          grep -q '^CONFIG_PACKAGE_zram-swap=y$' .config

          test -f package/passwall/luci-app-passwall/Makefile
          test -f package/passwall/xray-core/Makefile
          test -f package/passwall/shadowsocksr-libev/Makefile
          test -f feeds/packages/lang/golang/golang-package.mk
          test -f package/mtk-closed/drivers/mt7603e/Makefile
          test -f package/mtk-closed/drivers/mt7612e/Makefile
          test -f package/mtk-closed/drivers/mt_wifi/Makefile
          test -f package/mtk-closed/luci/luci-app-mtwifi/Makefile
          test -f target/linux/ramips/dts/MIR4.dts

          echo "MIR4 OpenWrt 18.06 validation passed."

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          export CC=gcc-10
          export CXX=g++-10
          make -j"${BUILD_JOBS}" V=s 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mir4-openwrt-18.06-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mir4-openwrt-18.06-mtk-passwall-${{ github.run_number }}
          path: openwrt/bin/targets/ramips/mt7621/*
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mir4-18.06-build-${{ github.run_number }}
          name: Xiaomi Mi Router 4 OpenWrt 18.06 MTK HWNAT PassWall ${{ github.run_number }}
          generate_release_notes: true
          files: openwrt/bin/targets/ramips/mt7621/*
      - name: Verify LuCI starts
        if: success()
        working-directory: openwrt
        run: |
          set -uo pipefail
          fail=0
          ROOTFS=$(find "$(pwd)/build_dir" -maxdepth 2 -type d -name 'root-*' | head -1)
          echo "== target rootfs: ${ROOTFS:-<not found>}"
          if [ -z "$ROOTFS" ]; then echo "::error::no root-* dir under build_dir"; exit 1; fi

          echo "-- 1) files the web interface needs"
          for f in usr/sbin/uhttpd etc/init.d/uhttpd etc/config/uhttpd \
                   usr/lib/lua/luci/dispatcher.lua www \
                   etc/uci-defaults/99-mir4-defaults etc/init.d/mir4-luci-check; do
            if [ -e "$ROOTFS/$f" ]; then echo "   OK      $f"; else echo "   MISSING $f"; fail=1; fi
          done


          echo "-- 1b) the status LED has to be configured for this board"
          if grep -q 'mir4:blue:status' "$ROOTFS/etc/board.d/01_leds"; then
            echo "   OK   01_leds carries the mir4 case"
          else
            echo "   FAIL 01_leds has no mir4 case -> board.json gets no led key"
            fail=1
          fi
          grep -n 'mir4|xiaomi,mir4)' -A2 "$ROOTFS/etc/board.d/01_leds" | sed 's/^/   /'

          echo "-- 2) run the real first-boot script inside the target rootfs"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-user-static >/dev/null
          sudo cp -f /usr/bin/qemu-mipsel-static "$ROOTFS/usr/bin/"
          sudo mkdir -p "$ROOTFS/var/run" "$ROOTFS/var/log" "$ROOTFS/proc" "$ROOTFS/dev" "$ROOTFS/tmp"
          sudo chroot "$ROOTFS" /usr/bin/qemu-mipsel-static /bin/sh \
              /etc/uci-defaults/99-mir4-defaults 2>&1 | tee "$GITHUB_WORKSPACE/firstboot.log"
          for want in "root-password=SET" "lan-ip=192.168.5.1" "uhttpd=PRESENT" "luci-dispatcher=PRESENT"; do
            if grep -q "$want" "$GITHUB_WORKSPACE/firstboot.log"; then
              echo "   OK   $want"
            else
              echo "   FAIL $want"; fail=1
            fi
          done

          echo "-- 3) start ubusd + uhttpd and fetch the LuCI entry page"
          sudo chroot "$ROOTFS" /usr/bin/qemu-mipsel-static /sbin/ubusd >/tmp/ubusd.log 2>&1 &
          sleep 1
          sudo chroot "$ROOTFS" /usr/bin/qemu-mipsel-static /usr/sbin/uhttpd \
               -p 8099 -h /www -t 1 -T 30 -n 2 -N 2 >/tmp/uhttpd.log 2>&1 &
          sleep 6
          code=$(curl -sS -o "$GITHUB_WORKSPACE/luci.html" -w '%{http_code}' \
                      --max-time 10 "http://127.0.0.1:8099/" || echo 000)
          echo "   HTTP $code"
          echo "   ---- first 400 bytes of the response ----"
          head -c 400 "$GITHUB_WORKSPACE/luci.html" 2>/dev/null || true
          echo
          echo "   ---- uhttpd log ----"; cat /tmp/uhttpd.log 2>/dev/null || true
          echo "   ---- ubusd log ----";  cat /tmp/ubusd.log  2>/dev/null || true
          if [ "$code" = "000" ]; then echo "   FAIL the web server did not answer"; fail=1; fi

          if [ "$fail" = "0" ]; then
            echo "LuCI verification: PASS"
          else
            echo "::error::LuCI verification failed"
            exit 1
          fi

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luci-verify-${{ github.run_number }}
          path: |
            firstboot.log
            luci.html
          if-no-files-found: ignore
          retention-days: 30
