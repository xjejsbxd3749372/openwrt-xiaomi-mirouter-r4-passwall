name: Build OpenWrt 19.07 MIR4 helloworld SSR Plus+

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'build-*'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-19.07
  OPENWRT_DIR: openwrt
  BUILD_JOBS: 4
  HELLOWORLD_REPO: https://github.com/fw876/helloworld.git
  GOLANG_REPO: https://github.com/sbwml/packages_lang_golang.git
  GOLANG_BRANCH: 27.x

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             build-essential clang llvm ccache file g++ gawk gettext git             libncurses5-dev libncursesw5-dev libssl-dev python3             rsync subversion swig unzip wget xsltproc zlib1g-dev jq             quilt default-jre-headless binutils

      - name: Create swap
        run: |
          set -eux
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Clone OpenWrt 19.07
        run: |
          git clone --depth 1 --single-branch --branch "${REPO_BRANCH}"             "${REPO_URL}" "${OPENWRT_DIR}"

      - name: Update base feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a

      - name: Install helloworld and real host dependencies
        working-directory: openwrt
        run: |
          set -eux
          bash "${GITHUB_WORKSPACE}/diy-part1.sh"
          bash "${GITHUB_WORKSPACE}/diy-part2.sh"

      - name: Defconfig and dependency validation
        working-directory: openwrt
        run: |
          set -eux
          cp "${GITHUB_WORKSPACE}/.config" .config
          make defconfig

          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mir4=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-ssr-plus=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config
          grep -q '^CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=y$' .config

          test -f package/helloworld/luci-app-ssr-plus/Makefile
          test -f package/helloworld/xray-core/Makefile
          test -f package/feeds/golang27/lang/golang/golang-package.mk
          test -f package/feeds/compat23/lang/rust/Makefile
          test -f package/feeds/modern/lang/lua/lyaml/Makefile
          test -f package/feeds/kcptun/kcptun/Makefile

          echo "MIR4 + helloworld + real Golang 1.27 + Rust host validation passed."

      - name: Build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"${BUILD_JOBS}" V=s 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-ssrplus-${{ github.run_number }}
          path: openwrt/bin/targets/ramips/mt7621/*
          if-no-files-found: error
          retention-days: 30

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('openwrt-19.07-mir4-ssrplus-{0}', github.run_number) }}
          name: OpenWrt 19.07 MIR4 SSR Plus+ ${{ github.run_number }}
          generate_release_notes: true
          files: openwrt/bin/targets/ramips/mt7621/*
